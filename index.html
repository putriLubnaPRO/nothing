<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lobby - Simulator Kereta Api Indonesia 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .lobby-card { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 20px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        h1 { text-align: center; font-size: 20px; color: #38bdf8; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn:active { transform: scale(0.98); }
        .admin-toggle { background: transparent; border: 1px dashed #64748b; color: #cbd5e1; font-size: 11px; }
        .admin-box { display: none; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #ef4444; margin-top: 8px; }
        .badge-admin { display: none; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="lobby-card">
    <h1>SIMULATOR KAI 2D <span id="adminBadge" class="badge-admin">ADMIN</span></h1>

    <div class="form-group">
        <label>NAMA MASINIS:</label>
        <input type="text" id="playerName" value="Masinis 1" placeholder="Nama masinis...">
    </div>

    <div class="form-group">
        <label>DAERAH OPERASI (DAOP):</label>
        <select id="daopSelect">
            <option value="daop1">DAOP 1 Jakarta</option>
            <option value="daop2">DAOP 2 Bandung</option>
            <option value="daop3">DAOP 3 Cirebon</option>
            <option value="daop4">DAOP 4 Semarang</option>
            <option value="daop5">DAOP 5 Purwokerto</option>
            <option value="daop6">DAOP 6 Yogyakarta</option>
            <option value="daop8">DAOP 8 Surabaya</option>
            <option value="daop9">DAOP 9 Jember</option>
        </select>
    </div>

    <div class="form-group">
        <label>STASIUN AWAL & TUJUAN:</label>
        <div style="display: flex; gap: 8px;">
            <select id="startStation"></select>
            <select id="endStation"></select>
        </div>
    </div>

    <div class="form-group">
        <label>LOKOMOTIF / ARMADA:</label>
        <select id="locoSelect">
            <option value="CC206">CC206 (Double Cab Modern)</option>
            <option value="CC203">CC203 (Aerodinamis Miring)</option>
            <option value="CC201">CC201 (Hidung Kotak Classic)</option>
            <option value="BB301">BB301 (Lokomotif Diesel Hidrolik)</option>
            <option value="KRL">KRL Commuter Line (Khusus Daop 1)</option>
        </select>
    </div>

    <div class="form-group">
        <label>TIPE GERBONG (6 RANGKAIAN):</label>
        <select id="coachSelect">
            <option value="K1">K1 Eksekutif</option>
            <option value="K2">K2 Bisnis</option>
            <option value="K3">K3 Ekonomi</option>
            <option value="CARGO">Gerbong Cargo / Barang</option>
        </select>
    </div>

    <button type="button" class="btn admin-toggle" id="toggleAdminBtn">🔑 Login Akses Admin Server</button>

    <div class="admin-box" id="adminBox">
        <label style="color: #fca5a5;">Password Admin Server:</label>
        <input type="password" id="adminPass" placeholder="Default: AdminKAI2026!">
        <button type="button" class="btn" style="background:#dc2626; padding:8px;" id="loginAdminBtn">Verifikasi Admin</button>
    </div>

    <button type="button" class="btn" id="startBtn" style="background: #16a34a; margin-top: 15px;">MASUK KE GAME 🚂</button>
</div>

<script>
    const stationsList = [
        "Gambir", "Pasar Senen", "Bandung", "Cirebon", "Semarang Tawang", "Purwokerto", 
        "Yogyakarta", "Solo Balapan", "Madiun", "Surabaya Gubeng", "Surabaya Pasar Turi", 
        "Malang", "Jember", "Banyuwangi", "Bogor", "Bekasi"
    ];

    const startSelect = document.getElementById('startStation');
    const endSelect = document.getElementById('endStation');
    const daopSelect = document.getElementById('daopSelect');
    const locoSelect = document.getElementById('locoSelect');
    const toggleAdminBtn = document.getElementById('toggleAdminBtn');
    const adminBox = document.getElementById('adminBox');
    const loginAdminBtn = document.getElementById('loginAdminBtn');
    const adminPass = document.getElementById('adminPass');
    const adminBadge = document.getElementById('adminBadge');
    const startBtn = document.getElementById('startBtn');

    let isAdmin = false;

    // Populate 16 Stasiun
    stationsList.forEach((st, idx) => {
        startSelect.innerHTML += `<option value="${st}" ${idx===0?'selected':''}>Awal: ${st}</option>`;
        endSelect.innerHTML += `<option value="${st}" ${idx===6?'selected':''}>Tujuan: ${st}</option>`;
    });

    // Validasi KRL hanya di Daop 1
    function validateKRL() {
        const krlOpt = locoSelect.querySelector('option[value="KRL"]');
        if (daopSelect.value !== 'daop1') {
            krlOpt.disabled = true;
            if (locoSelect.value === 'KRL') {
                locoSelect.value = 'CC206';
                alert('KRL Commuter Line hanya diizinkan beroperasi di DAOP 1 Jakarta!');
            }
        } else {
            krlOpt.disabled = false;
        }
    }
    daopSelect.addEventListener('change', validateKRL);

    toggleAdminBtn.addEventListener('click', () => {
        adminBox.style.display = adminBox.style.display === 'block' ? 'none' : 'block';
    });

    loginAdminBtn.addEventListener('click', () => {
        if (adminPass.value === 'AdminKAI2026!') {
            isAdmin = true;
            adminBadge.style.display = 'inline-block';
            alert('Berhasil Login Admin! Anda mendapat kontrol penuh Server & Wesel.');
            adminBox.style.display = 'none';
        } else {
            alert('Password Admin Salah!');
        }
    });

    startBtn.addEventListener('click', () => {
        if (startSelect.value === endSelect.value) {
            alert('Stasiun awal dan tujuan tidak boleh sama!');
            return;
        }

        localStorage.setItem('playerName', document.getElementById('playerName').value || 'Masinis');
        localStorage.setItem('selectedDaop', daopSelect.value);
        localStorage.setItem('startStation', startSelect.value);
        localStorage.setItem('endStation', endSelect.value);
        localStorage.setItem('selectedLoco', locoSelect.value);
        localStorage.setItem('selectedCoach', document.getElementById('coachSelect').value);
        localStorage.setItem('isAdmin', isAdmin ? 'true' : 'false');

        window.location.href = 'game.html';
    });

    validateKRL();
</script>
</body>
    </html>

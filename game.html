<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game - Simulator Kereta Api 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        #game-container { position: relative; width: 100vw; height: calc(100vh - 140px); }
        canvas { display: block; width: 100%; height: 100%; }

        /* Dashboard & Controls */
        #dashboard {
            height: 140px; background: #1e293b; border-top: 3px solid #334155;
            display: flex; padding: 8px 12px; gap: 10px; box-sizing: border-box;
        }
        .panel {
            background: #0f172a; border: 1px solid #334155; border-radius: 8px;
            padding: 8px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .speed-panel { flex: 1; align-items: center; justify-content: center; border-color: #38bdf8; }
        .speed-val { font-size: 28px; font-weight: bold; color: #38bdf8; font-family: monospace; }

        .ctrl-panel { flex: 2.5; display: flex; gap: 8px; }
        .slider-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .slider-box label { font-size: 10px; font-weight: bold; color: #94a3b8; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #334155; border-radius: 4px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #f97316; cursor: pointer; }

        .btn-horn {
            flex: 1; background: linear-gradient(135deg, #dc2626, #991b1b); border: none;
            border-radius: 6px; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
            box-shadow: 0 3px 0 #7f1d1d;
        }
        .btn-horn:active { transform: translateY(2px); box-shadow: none; }

        .wesel-panel { flex: 1.2; align-items: center; justify-content: center; gap: 6px; }
        .btn-action { background: #0284c7; border: none; color: white; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; width: 100%; }

        .info-panel { flex: 2; font-size: 11px; line-height: 1.4; color: #cbd5e1; }
        .badge { padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .admin-bg { background: #dc2626; color: white; }
        .player-bg { background: #0284c7; color: white; }

        /* Modal Overlay Server & Crash */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 99; justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 8px; width: 320px; text-align: center; border: 1px solid #475569; }
        .modal h2 { margin-bottom: 10px; color: #ef4444; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="dashboard">
        <div class="panel speed-panel">
            <div class="speed-val" id="speedDisplay">0 <span style="font-size:14px">km/h</span></div>
            <div style="font-size:9px; color:#64748b;">KECEPATAN</div>
        </div>

        <div class="panel ctrl-panel">
            <div class="slider-box">
                <label>THROTTLE</label>
                <input type="range" id="throttle" min="0" max="100" value="0">
                <span id="tVal" style="font-size:10px; color:#f97316;">N-0</span>
            </div>
            <div class="slider-box">
                <label>REM</label>
                <input type="range" id="brake" min="0" max="100" value="0">
                <span id="bVal" style="font-size:10px; color:#ef4444;">Rilis</span>
            </div>
            <button class="btn-horn" id="hornBtn">SEMBOYAN 35<br><span style="font-size:8px;">(KLAKSON)</span></button>
        </div>

        <div class="panel wesel-panel">
            <button class="btn-action" id="weselBtn">GANTI WESEL</button>
            <span id="weselText" style="font-size:9px; color:#38bdf8;">Jalur: LURUS</span>
            <button class="btn-action" id="adminPanelBtn" style="background:#dc2626; display:none;">PANEL SERVER</button>
        </div>

        <div class="panel info-panel">
            <div><span id="dispName">Masinis</span> <span id="dispRole" class="badge player-bg">PLAYER</span></div>
            <div>Rute: <span id="dispRoute" style="color:#fff;">Gambir - Jogja</span></div>
            <div>Posisi: <span id="dispPos" style="color:#fff;">KM 00+000</span></div>
            <div>Stasiun: <span id="dispNext" style="color:#38bdf8;">Gambir</span></div>
        </div>
    </div>

    <!-- Modal Tabrakan -->
    <div class="modal" id="crashModal">
        <div class="modal-content">
            <h2>💥 TABRAKAN!</h2>
            <p style="font-size:12px; margin-bottom:15px;">Kereta Anda bertabrakan dengan Rangkaian lain di jalur yang sama!</p>
            <button class="btn-action" id="respawnBtn" style="background:#16a34a; padding:10px;">RESPAWN KERETA</button>
        </div>
    </div>

    <!-- Modal Panel Admin -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3 style="color:#38bdf8; margin-bottom:10px;">PANEL SERVER VIRTUAL ADMIN</h3>
            <button class="btn-action" id="serverToggleBtn" style="background:#dc2626; margin-bottom:6px;">TURN OFF SERVER</button>
            <button class="btn-action" id="bcastBtn" style="background:#f59e0b; margin-bottom:6px;">BROADCAST PESAN</button>
            <button class="btn-action" id="kickBtn" style="background:#6b21a8; margin-bottom:10px;">KICK BOT KERETA</button>
            <button class="btn-action" id="closeAdminModal" style="background:#475569;">TUTUP</button>
        </div>
    </div>

    <script>
        // Load Data dari Lobby
        const pName = localStorage.getItem('playerName') || 'Masinis';
        const startSt = localStorage.getItem('startStation') || 'Gambir';
        const endSt = localStorage.getItem('endStation') || 'Yogyakarta';
        const loco = localStorage.getItem('selectedLoco') || 'CC206';
        const coach = localStorage.getItem('selectedCoach') || 'K1';
        const isAdmin = localStorage.getItem('isAdmin') === 'true';

        document.getElementById('dispName').innerText = pName;
        document.getElementById('dispRoute').innerText = `${startSt} ➔ ${endSt}`;
        if (isAdmin) {
            const r = document.getElementById('dispRole');
            r.innerText = 'ADMIN';
            r.className = 'badge admin-bg';
            document.getElementById('adminPanelBtn').style.display = 'block';
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = document.getElementById('game-container').clientWidth;
            canvas.height = document.getElementById('game-container').clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Web Audio Synthesizer (Semboyan 35)
        let audioCtx = null;
        function playS35() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
            const g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();

            o1.type = 'sawtooth'; o2.type = 'square';
            o1.frequency.setValueAtTime(311, now);
            o2.frequency.setValueAtTime(370, now);

            f.type = 'lowpass'; f.frequency.setValueAtTime(1200, now);
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(0.3, now + 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

            o1.connect(f); o2.connect(f); f.connect(g); g.connect(audioCtx.destination);
            o1.start(now); o2.start(now); o1.stop(now + 1.8); o2.stop(now + 1.8);
        }
        document.getElementById('hornBtn').addEventListener('click', playS35);

        // State Simulator
        let serverActive = true;
        let isDivergent = false; // Wesel State
        const weselPos = 6000;

        const train = {
            x: 200, speed: 0, kmh: 0, throttle: 0, brake: 0,
            track: 0, crashed: false, length: 140 + (6 * 136)
        };

        // Virtual Bot Multiplayer Player lain
        let botTrain = {
            x: 5000, speed: 2.5, track: 0, active: true
        };

        const stations = [
            { name: startSt, x: 500 },
            { name: "Cirebon", x: 12000 },
            { name: "Purwokerto", x: 25000 },
            { name: endSt, x: 45000 }
        ];

        // Controls binding
        const throttleIn = document.getElementById('throttle');
        const brakeIn = document.getElementById('brake');
        throttleIn.addEventListener('input', (e) => {
            train.throttle = parseFloat(e.target.value);
            document.getElementById('tVal').innerText = `N-${Math.ceil(train.throttle/12.5)}`;
        });
        brakeIn.addEventListener('input', (e) => {
            train.brake = parseFloat(e.target.value);
            document.getElementById('bVal').innerText = train.brake === 0 ? 'Rilis' : `${Math.round(train.brake)}%`;
        });

        // Wesel Toggle Logic
        document.getElementById('weselBtn').addEventListener('click', () => {
            const dist = Math.abs(train.x - weselPos);
            if (isAdmin || dist < 500) {
                isDivergent = !isDivergent;
                document.getElementById('weselText').innerText = isDivergent ? "Jalur: BELOK" : "Jalur: LURUS";
            } else {
                alert('Terlalu jauh dari Wesel (KM 06+000)!');
            }
        });

        // Admin Panel Actions
        document.getElementById('adminPanelBtn').addEventListener('click', () => {
            document.getElementById('adminModal').style.display = 'flex';
        });
        document.getElementById('closeAdminModal').addEventListener('click', () => {
            document.getElementById('adminModal').style.display = 'none';
        });
        document.getElementById('serverToggleBtn').addEventListener('click', () => {
            serverActive = !serverActive;
            alert(serverActive ? "Server Virtual Diaktifkan!" : "Server Virtual Dimatikan Admin!");
        });
        document.getElementById('bcastBtn').addEventListener('click', () => {
            const msg = prompt("Pesan Broadcast Admin:");
            if (msg) alert(`[ANNOUNCEMENT ADMIN]: ${msg}`);
        });
        document.getElementById('kickBtn').addEventListener('click', () => {
            botTrain.active = false;
            alert('Bot/Pemain lain berhasil di-kick dari server!');
        });

        // Respawn Action
        document.getElementById('respawnBtn').addEventListener('click', () => {
            train.x = 200; train.speed = 0; train.crashed = false; train.track = 0;
            document.getElementById('crashModal').style.display = 'none';
        });

        // Physics Update
        function update() {
            if (!serverActive || train.crashed) return;

            // Motor Physics
            let accel = (train.throttle / 100) * 0.012 - (train.brake / 100) * 0.030 - 0.002;
            train.speed += accel;
            if (train.speed < 0) train.speed = 0;
            if (train.speed > 12) train.speed = 12;

            train.x += train.speed;

            // Track Switching at Wesel
            if (train.x > weselPos && isDivergent) {
                train.track = 1;
            } else if (train.x <= weselPos) {
                train.track = 0;
            }

            // Update Bot Motion
            if (botTrain.active) {
                botTrain.x += botTrain.speed;
                if (botTrain.x > 48000) botTrain.x = 2000;

                // Tabrakan Detection (No-Ghosting)
                if (train.track === botTrain.track && Math.abs(train.x - botTrain.x) < 120) {
                    train.crashed = true;
                    train.speed = 0;
                    document.getElementById('crashModal').style.display = 'flex';
                }
            }

            // UI Speed & Distances
            train.kmh = Math.round(train.speed * 10);
            document.getElementById('speedDisplay').innerHTML = `${train.kmh} <span style="font-size:14px">km/h</span>`;

            const km = Math.floor(train.x / 1000);
            const m = Math.floor(train.x % 1000);
            document.getElementById('dispPos').innerText = `KM ${km.toString().padStart(2,'0')}+${m.toString().padStart(3,'0')}`;

            let next = stations.find(s => s.x > train.x - 200);
            if (next) {
                document.getElementById('dispNext').innerText = `${next.name} (${Math.max(0, Math.round((next.x - train.x)/10))}m)`;
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawLocomotive(x, y) {
            const w = 140, h = 45;
            // Roda
            ctx.fillStyle = '#111';
            [x + 20, x + 40, x + w - 40, x + w - 20].forEach(wx => {
                ctx.beginPath(); ctx.arc(wx, y + h + 8, 8, 0, Math.PI * 2); ctx.fill();
            });

            if (loco === 'CC201') {
                ctx.fillStyle = '#dc2626'; ctx.fillRect(x, y + 5, w, h - 10);
                ctx.fillStyle = '#f59e0b'; ctx.fillRect(x, y + h - 12, w, 4);
                ctx.fillStyle = '#000'; ctx.fillRect(x + w - 30, y + 8, 18, 10);
            } else if (loco === 'CC203') {
                ctx.fillStyle = '#fff'; ctx.fillRect(x, y + 5, w - 15, h - 10);
                ctx.beginPath(); ctx.moveTo(x + w - 15, y + 5); ctx.lineTo(x + w, y + 20); ctx.lineTo(x + w - 15, y + h - 5); ctx.fill();
                ctx.fillStyle = '#1d4ed8'; ctx.fillRect(x, y + h - 12, w - 5, 5);
            } else if (loco === 'KRL') {
                ctx.fillStyle = '#cbd5e1'; ctx.fillRect(x, y, w, h - 5);
                ctx.fillStyle = '#dc2626'; ctx.fillRect(x, y, w, 6); ctx.fillRect(x + w - 20, y, 20, h - 5);
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x + 20, y); ctx.lineTo(x + 35, y - 12); ctx.lineTo(x + 50, y); ctx.stroke();
            } else {
                // CC206
                ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h - 5);
                ctx.fillStyle = '#dc2626'; ctx.fillRect(x, y + h - 16, w, 4);
                ctx.fillStyle = '#0284c7'; ctx.fillRect(x, y + h - 12, w, 6);
                ctx.fillStyle = '#000'; ctx.fillRect(x + w - 25, y + 6, 18, 10); ctx.fillRect(x + 8, y + 6, 18, 10);
            }

            // Headlight
            ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(x + w - 2, y + 18, 4, 0, Math.PI * 2); ctx.fill();
        }

        function drawCoach(x, y) {
            const w = 130, h = 45;
            ctx.fillStyle = '#111';
            [x + 20, x + 40, x + w - 40, x + w - 20].forEach(wx => {
                ctx.beginPath(); ctx.arc(wx, y + h + 8, 8, 0, Math.PI * 2); ctx.fill();
            });

            ctx.fillStyle = coach === 'CARGO' ? '#475569' : '#e2e8f0';
            ctx.fillRect(x, y + 3, w, h - 8);

            if (coach !== 'CARGO') {
                ctx.fillStyle = '#1e3a8a';
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(x + 12 + (i * 18), y + 12, 12, 8);
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 30;
            const camX = train.x - (canvas.width * 0.4);

            // Sky & Parallax Background
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.moveTo(0, groundY);
            for (let x = 0; x < canvas.width + 100; x += 100) {
                let wx = x + camX * 0.1;
                ctx.lineTo(x, groundY - (Math.sin(wx * 0.002) * 80 + 100));
            }
            ctx.lineTo(canvas.width, groundY); ctx.fill();

            // Track Main & Branch
            const trackY = groundY - 20;
            ctx.fillStyle = '#334155'; ctx.fillRect(0, trackY, canvas.width, 10);
            ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, trackY - 3, canvas.width, 3); // Rel Utama

            // Visual Wesel
            let wX = weselPos - camX;
            if (wX > -100 && wX < canvas.width + 100) {
                ctx.fillStyle = '#ef4444'; ctx.fillRect(wX, trackY - 6, 15, 8);
                ctx.strokeStyle = isDivergent ? '#38bdf8' : '#64748b';
                ctx.beginPath(); ctx.moveTo(wX, trackY - 3); ctx.lineTo(wX + 120, trackY - 23); ctx.stroke();
            }

            // Stasiun Render
            stations.forEach(s => {
                let stX = s.x - camX;
                if (stX > -200 && stX < canvas.width + 200) {
                    ctx.fillStyle = '#0284c7'; ctx.fillRect(stX, trackY - 80, 180, 80);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(s.name, stX + 20, trackY - 50);
                }
            });

            // Draw Players Train
            let pY = trackY - 45 - (train.track * 20);
            let pX = train.x - camX;
            drawLocomotive(pX, pY);
            for (let i = 1; i <= 6; i++) {
                drawCoach(pX - (i * 136), pY);
            }

            // Draw Virtual Bot Train (Multiplayer)
            if (botTrain.active) {
                let bX = botTrain.x - camX;
                let bY = trackY - 45 - (botTrain.track * 20);
                ctx.fillStyle = '#f59e0b';
                ctx.fillText("🔴 MULTIPLAYER BOT", bX, bY - 10);
                drawLocomotive(bX, bY);
            }

            // Ground
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, groundY, canvas.width, 30);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>

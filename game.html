<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator Kereta Api 2D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #dashboard {
            height: 160px;
            background: #2b2b2b;
            border-top: 4px solid #444;
            display: flex;
            padding: 15px;
            gap: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        .panel {
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .speed-panel {
            flex: 1;
            align-items: center;
            justify-content: center;
            background: #111;
            border: 2px solid #00ffcc;
        }
        .speed-display {
            font-size: 36px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        .speed-label {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
        }
        .control-panel {
            flex: 2.2;
            display: flex;
            gap: 12px;
        }
        .slider-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .slider-group label {
            font-size: 11px;
            font-weight: bold;
            color: #ccc;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #444;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff9900;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .horn-btn {
            flex: 1;
            background: linear-gradient(135deg, #d32f2f, #8e0000);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #5c0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .horn-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #5c0000;
        }
        .wesel-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: #141e27;
            border: 1px solid #0284c7;
        }
        .btn-wesel {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        .btn-wesel:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .info-panel {
            flex: 1.8;
            font-size: 12px;
            line-height: 1.5;
            color: #bbb;
        }
        .info-value {
            color: #fff;
            font-weight: bold;
        }
        .badge-role {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .role-admin { background: #dc2626; color: #fff; }
        .role-player { background: #0284c7; color: #fff; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="dashboard">
        <div class="panel speed-panel">
            <div class="speed-display" id="speedometer">0 <span style="font-size: 16px">km/h</span></div>
            <div class="speed-label">KECEPATAN UTAMA</div>
        </div>

        <div class="panel control-panel">
            <div class="slider-group">
                <label for="throttle">THROTTLE</label>
                <input type="range" id="throttle" min="0" max="100" value="0">
                <span id="throttle-val" style="font-size:11px; color:#ff9900;">Notch 0</span>
            </div>
            <div class="slider-group">
                <label for="brake">REM UTAMA</label>
                <input type="range" id="brake" min="0" max="100" value="0">
                <span id="brake-val" style="font-size:11px; color:#ff3333;">Rilis</span>
            </div>
            <button class="horn-btn" id="hornBtn">
                <span>SEMBOYAN 35</span>
                <span style="font-size: 9px; opacity: 0.8;">(KLAKSON)</span>
            </button>
        </div>

        <div class="panel wesel-panel">
            <div style="font-size:11px; color:#94a3b8; font-weight:bold;">KONTROL WESEL</div>
            <button class="btn-wesel" id="toggleWeselBtn">GANTI WESEL LOKAL</button>
            <span id="weselStatus" style="font-size:10px; color:#38bdf8;">Jalur: LURUS (Jalur 1)</span>
        </div>

        <div class="panel info-panel">
            <div>Pemain: <span class="info-value" id="disp-player">Masinis</span> <span id="disp-role" class="badge-role role-player">PLAYER</span></div>
            <div>Lokomotif: <span class="info-value" id="disp-loco">CC206</span></div>
            <div>Lokasi: <span class="info-value" id="location-val">KM 00+000</span></div>
            <div>Stasiun Terdekat: <span class="info-value" id="next-station">Gambir</span></div>
        </div>
    </div>

    <script>
        // Data dari Lobby
        const playerName = localStorage.getItem('playerName') || 'Masinis';
        const selectedDaop = localStorage.getItem('selectedDaop') || 'daop1';
        const selectedLoco = localStorage.getItem('selectedLocomotive') || 'CC206';
        const isAdmin = localStorage.getItem('isAdmin') === 'true';

        // Set Display Info
        document.getElementById('disp-player').innerText = playerName;
        document.getElementById('disp-loco').innerText = selectedLoco;
        const roleBadge = document.getElementById('disp-role');
        if (isAdmin) {
            roleBadge.innerText = 'ADMIN SERVER';
            roleBadge.className = 'badge-role role-admin';
        } else {
            roleBadge.innerText = 'PLAYER (PEMAIN)';
            roleBadge.className = 'badge-role role-player';
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Audio Context (Semboyan 35 Horn)
        let audioCtx = null;
        function playS35Horn() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = 'sawtooth';
            osc2.type = 'square';

            // Dual tone S35 khas Indonesia (~311Hz & ~370Hz)
            osc1.frequency.setValueAtTime(311, now);
            osc2.frequency.setValueAtTime(370, now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 1.8);
            osc2.stop(now + 1.8);
        }

        document.getElementById('hornBtn').addEventListener('click', playS35Horn);

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State & Physical Constants
        const train = {
            x: 500,
            speed: 0,
            kmh: 0,
            throttle: 0,
            brake: 0,
            maxSpeed: 120,
            trackIndex: 0 // 0: Jalur Utama, 1: Jalur Belok/Wesel
        };

        const mapLength = 80000; // Peta Luas (80.000px)
        const weselPosition = 8000; // Lokasi Titik Wesel di KM 08+000
        let isWeselDivergent = false; // False = Lurus, True = Belok

        const stations = [
            { name: "Stasiun Gambir", x: 1000 },
            { name: "Stasiun Jatinegara", x: 15000 },
            { name: "Stasiun Cikarang", x: 38000 },
            { name: "Stasiun Cirebon", x: 75000 }
        ];

        const locoWidth = 140;
        const coachWidth = 130;
        const trainGap = 6;

        // UI Controls
        const throttleInput = document.getElementById('throttle');
        const brakeInput = document.getElementById('brake');
        const throttleVal = document.getElementById('throttle-val');
        const brakeVal = document.getElementById('brake-val');
        const speedometer = document.getElementById('speedometer');
        const locationVal = document.getElementById('location-val');
        const nextStationVal = document.getElementById('next-station');
        const toggleWeselBtn = document.getElementById('toggleWeselBtn');
        const weselStatus = document.getElementById('weselStatus');

        throttleInput.addEventListener('input', (e) => {
            train.throttle = parseFloat(e.target.value);
            const notch = Math.ceil(train.throttle / 12.5);
            throttleVal.innerText = notch === 0 ? "Notch 0 (Idle)" : `Notch ${notch}`;
        });

        brakeInput.addEventListener('input', (e) => {
            train.brake = parseFloat(e.target.value);
            brakeVal.innerText = train.brake === 0 ? "Rilis" : `${Math.round(train.brake)}%`;
        });

        // Kontrol Wesel (Sistem Akses Admin vs Player)
        function adminToggleWesel() {
            isWeselDivergent = !isWeselDivergent;
            weselStatus.innerText = isWeselDivergent ? "Jalur: BELOK (Jalur 2)" : "Jalur: LURUS (Jalur 1)";
        }

        toggleWeselBtn.addEventListener('click', () => {
            const distanceToWesel = Math.abs(train.x - weselPosition);
            
            if (isAdmin) {
                // Admin bisa memindahkan wesel secara paksa kapan saja
                adminToggleWesel();
            } else {
                // Player biasa hanya bisa ganti wesel jika dekat (radius < 400px)
                if (distanceToWesel < 400) {
                    adminToggleWesel();
                } else {
                    alert('Kereta Anda terlalu jauh dari lokasi Wesel (KM 08+000) untuk memindahkan jalur!');
                }
            }
        });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') {
                throttleInput.value = Math.min(100, parseInt(throttleInput.value) + 10);
                throttleInput.dispatchEvent(new Event('input'));
            } else if (e.key === 's' || e.key === 'S') {
                throttleInput.value = Math.max(0, parseInt(throttleInput.value) - 10);
                throttleInput.dispatchEvent(new Event('input'));
            } else if (e.key === 'd' || e.key === 'D') {
                brakeInput.value = Math.min(100, parseInt(brakeInput.value) + 10);
                brakeInput.dispatchEvent(new Event('input'));
            } else if (e.key === 'a' || e.key === 'A') {
                brakeInput.value = Math.max(0, parseInt(brakeInput.value) - 10);
                brakeInput.dispatchEvent(new Event('input'));
            } else if (e.code === 'Space') {
                playS35Horn();
            }
        });

        function updatePhysics() {
            // Fisika Akselerasi & Bobot Berat
            const enginePower = (train.throttle / 100) * 0.012;
            const brakeForce = (train.brake / 100) * 0.030;
            const friction = 0.002 + (train.speed * 0.00004);

            let accel = enginePower - brakeForce - friction;
            train.speed += accel;
            if (train.speed < 0) train.speed = 0;

            const maxPxSpeed = (train.maxSpeed / 10);
            if (train.speed > maxPxSpeed) train.speed = maxPxSpeed;

            train.x += train.speed;
            if (train.x > mapLength) train.x = mapLength;

            // Pindah Jalur jika melewati titik wesel
            if (train.x > weselPosition && isWeselDivergent) {
                train.trackIndex = 1;
            } else if (train.x <= weselPosition) {
                train.trackIndex = 0;
            }

            // Update UI Wesel Button state
            const dist = Math.abs(train.x - weselPosition);
            if (!isAdmin && dist > 400) {
                toggleWeselBtn.innerText = "GANTI WESEL (Jauh)";
            } else {
                toggleWeselBtn.innerText = isAdmin ? "GANTI WESEL (Admin)" : "GANTI WESEL LOKAL";
            }

            // UI Speedometer & Posisi
            train.kmh = Math.round(train.speed * 10);
            speedometer.innerHTML = `${train.kmh} <span style="font-size: 16px">km/h</span>`;

            const km = Math.floor(train.x / 1000);
            const m = Math.floor(train.x % 1000);
            locationVal.innerText = `KM ${km.toString().padStart(2, '0')}+${m.toString().padStart(3, '0')}`;

            let upcoming = stations.find(s => s.x > train.x - 200);
            if (upcoming) {
                const d = Math.round((upcoming.x - train.x) / 10);
                nextStationVal.innerText = `${upcoming.name} (${d > 0 ? d + 'm' : 'Tiba'})`;
            } else {
                nextStationVal.innerText = "Akhir Jalur";
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawBackground(cameraX, groundY) {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#0f172a');
            skyGrad.addColorStop(0.7, '#334155');
            skyGrad.addColorStop(1, '#64748b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gunung Parallax 1
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            for (let x = 0; x < canvas.width + 100; x += 100) {
                let worldX = x + cameraX * 0.05;
                let h = Math.sin(worldX * 0.001) * 120 + Math.cos(worldX * 0.003) * 60 + 160;
                ctx.lineTo(x, groundY - h);
            }
            ctx.lineTo(canvas.width, groundY);
            ctx.fill();

            // Bukit Parallax 2
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            for (let x = 0; x < canvas.width + 50; x += 50) {
                let worldX = x + cameraX * 0.2;
                let h = Math.sin(worldX * 0.005) * 45 + 60;
                ctx.lineTo(x, groundY - h);
            }
            ctx.lineTo(canvas.width, groundY);
            ctx.fill();

            // Pohon
            for (let i = -200; i < canvas.width + 200; i += 120) {
                let treeX = i - (cameraX * 0.5 % 120);
                ctx.fillStyle = '#422006';
                ctx.fillRect(treeX + 15, groundY - 40, 8, 40);
                ctx.fillStyle = '#14532d';
                ctx.beginPath();
                ctx.arc(treeX + 19, groundY - 48, 22, 0, Math.PI * 2);
                ctx.fill();
            }

            // Tanah
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        }

        function drawTrack(cameraX, groundY) {
            const trackY = groundY - 15;

            // Ballast / Kerikil Rel
            ctx.fillStyle = '#444';
            ctx.fillRect(0, trackY, canvas.width, 15);

            // Bantalan Rel
            ctx.fillStyle = '#27272a';
            const tieSpacing = 20;
            const startX = -(cameraX % tieSpacing);
            for (let x = startX; x < canvas.width; x += tieSpacing) {
                ctx.fillRect(x, trackY, 8, 12);
            }

            // Rel Utama
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, trackY - 4, canvas.width, 4);

            // Visual Cabang Wesel di KM 08+000
            let weselScreenX = weselPosition - cameraX;
            if (weselScreenX > -200 && weselScreenX < canvas.width + 200) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(weselScreenX, trackY - 8, 20, 10); // Marker Wesel

                // Rel Belok bercabang
                ctx.strokeStyle = isWeselDivergent ? '#38bdf8' : '#64748b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(weselScreenX, trackY - 4);
                ctx.lineTo(weselScreenX + 150, trackY - 20);
                ctx.stroke();
                ctx.lineWidth = 1;
            }

            // Tiang Listrik Aliran Atas
            const poleSpacing = 280;
            const startPole = -(cameraX % poleSpacing);
            for (let x = startPole; x < canvas.width; x += poleSpacing) {
                ctx.fillStyle = '#334155';
                ctx.fillRect(x, trackY - 170, 8, 170);
                ctx.fillRect(x - 15, trackY - 160, 35, 4);
                ctx.strokeStyle = '#0f172a';
                ctx.beginPath();
                ctx.moveTo(x - 15, trackY - 160);
                ctx.lineTo(x + poleSpacing - 15, trackY - 160);
                ctx.stroke();
            }

            // Stasiun
            stations.forEach(st => {
                let stX = st.x - cameraX;
                if (stX > -400 && stX < canvas.width + 400) {
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(stX, trackY - 110, 280, 110);
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(stX - 10, trackY - 125, 300, 15);
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(stX + 70, trackY - 85, 140, 35);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(st.name, stX + 140, trackY - 63);
                    ctx.textAlign = 'start';
                }
            });
        }

        function drawBogiesAndWheels(x, y, width) {
            const wheelY = y + 20;
            const radius = 8;
            [x + 18, x + 38, width - 38, width - 18].forEach(wX =
